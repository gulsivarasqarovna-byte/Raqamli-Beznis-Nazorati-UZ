services:
  - type: web
    name: company-app
    env: node
    plan: free
    
    # Build configuration - install all dependencies including devDependencies
    buildCommand: npm install --legacy-peer-deps && npm run build
    
    # Start command
    startCommand: npm start
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_FLAGS
        value: --legacy-peer-deps
    
    # Auto-deploy settings
    autoDeploy: true
