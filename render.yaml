services:
  - type: web
    name: company-app
    env: node
    plan: free
    
    # Build configuration
    buildCommand: npm install && npm run build
    
    # Start command
    startCommand: npm start
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
    
    # Auto-deploy settings
    autoDeploy: true
